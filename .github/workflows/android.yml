name: Android

# PRs and main: unit tests + a debug APK (downloadable from the run).
# A v* tag: the same checks, then a signed release APK + SHA256SUMS published as a GitHub
# Release — exactly what WaveTop's in-app updater (Settings → Updates) looks for.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test and build (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WaveTop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match version.properties
        id: version
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName=$VERSION in version.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WAVETOP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret WAVETOP_KEYSTORE_BASE64 is missing (see docs/releasing.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wavetop-release.jks"

      - name: Release APK
        env:
          WAVETOP_KEYSTORE_FILE: ${{ runner.temp }}/wavetop-release.jks
          WAVETOP_KEYSTORE_PASSWORD: ${{ secrets.WAVETOP_KEYSTORE_PASSWORD }}
          WAVETOP_KEY_ALIAS: ${{ secrets.WAVETOP_KEY_ALIAS }}
          WAVETOP_KEY_PASSWORD: ${{ secrets.WAVETOP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WaveTop-$VERSION.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/WaveTop-$VERSION.apk" | tee dist/signer.txt
          cd dist && sha256sum "WaveTop-$VERSION.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create "$GITHUB_REF_NAME" \
            "dist/WaveTop-$VERSION.apk" dist/SHA256SUMS.txt \
            --title "WaveTop $VERSION" \
            --generate-notes
